spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.config.import=optional:file:.env[.properties]
# Spring AI · Anthropic (R51). 키는 .env 또는 환경 변수 ANTHROPIC_API_KEY에서만 읽는다. 없으면 가짜 값으로 앱만 띄운다
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:no-key}
spring.ai.anthropic.chat.model=${AI_MODEL:claude-haiku-5-5}
spring.ai.anthropic.chat.max-tokens=16000
spring.ai.anthropic.timeout=30s
spring.ai.anthropic.max-retries=0
# MySQL (R51 인식 이력). 접속 정보는 .env의 DB_URL · DB_USERNAME · DB_PASSWORD. DB가 없으면 travelback을 새로 만든다
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travelback?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
